[project]
name = "nuway-ml"
version = "0.0.0"
description = "nuway ML library: geometry twins, datasets, models, training (no rclpy)"
requires-python = "==3.12.*"
# Import-light runtime deps only. torch is an extra (03_style_and_conventions.md §6.1):
# a plain `uv sync` yields the GT-only environment of M0-M2.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nuway_ml"]
