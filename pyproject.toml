[project]
name = "nuway"
version = "0.0.0"
description = "Toy modular autonomous-driving stack on CARLA 0.9.16 and ROS 2 Jazzy (uv workspace root)"
requires-python = "==3.12.*"
dependencies = ["nuway-ml"]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "pre-commit",
  "clang-format>=18",   # LLVM >= 18 wheels; exact pins in uv.lock
  "clang-tidy>=18",
  "gersemi",
  "pyyaml",
  "types-pyyaml",
  "types-setuptools>=84.0.0.20260812",
]
carla = [
    "carla==0.9.16",
    "pillow>=12.3.0",
]
infer = ["nuway-ml[torch]"]       # run learned profiles (M3+) without training tooling
train = ["hydra-core", "wandb", "nuway-ml[torch]"]   # config management and run/metric logging (03 §9.7)
viz = ["matplotlib", "rosbags", "jupyterlab"]        # headless rendering (02_interfaces.md §8); never imported by runtime nodes
# Python deps of external/{leaderboard,scenario_runner}. M1 task 19 completes the list from the
# pinned checkouts' requirements.txt (03 §6.4); these are the ones known today.
leaderboard = [
    "py-trees==0.8.3",
    "networkx",
    "shapely",
    "dictor>=0.1.12",
    "requests>=2.34.2",
    "opencv-python>=5.0.0.93",
    "pygame>=2.6.1",
    "tabulate>=0.10.0",
    "pexpect>=4.9.0",
    "transforms3d>=0.4.2",
    "psutil>=7.2.2",
    "xmlschema>=4.3.2",
    "ephem>=4.2.1",
    "six>=1.17.0",
    "simple-watchdog-timer>=0.1.1",
    "antlr4-python3-runtime==4.10",
    "graphviz>=0.21",
]

[tool.uv]
package = false                    # the root is not installable
python-preference = "only-system"  # must be Jazzy's /usr/bin/python3.12
default-groups = ["dev"]
# colcon builds ament_python packages with `setup.py develop`, removed in setuptools 80,
# and the venv's setuptools shadows the distro's through PYTHONPATH (03 §6.1).
constraint-dependencies = ["setuptools<80"]

[tool.uv.workspace]
members = ["ml"]

[tool.uv.sources]
nuway-ml = { workspace = true }
torch = { index = "pytorch-cu126" }   # applies to ml/pyproject.toml's optional `torch` extra (workspace-wide source)

[[tool.uv.index]]
name = "pytorch-cu126"             # see 03 §6.1 for why cu126 and not cu130
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["ml/tests", "tools", "tests"]
pythonpath = ["tools/eval", "tools/viz", "ros2_ws/src/nuway_bringup", "tests/integration"]  # nuway_eval (docs/01 Rules) and the pure-Python profile loader, so tests/integration runs without a colcon build
addopts = "--strict-markers -p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"  # ROS pytest plugins leak in via system site packages; launch_testing breaks pytest >= 8
markers = [
  "slow: minutes-long",
  "carla: needs a running CARLA server",
  "gpu: needs CUDA",
  "import_light: must pass in an env without torch",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["ros2_ws/build", "ros2_ws/install", "ros2_ws/log", "ros2_ws/src/carla_msgs", "data", "external", "*.md"]  # *.md: ruff >= 0.16 formats Markdown code blocks, and docs/ holds pseudo-Python

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade (3.12 idioms)
  "B",         # bugbear
  "D",         # pydocstyle
  "ANN",       # type annotations required
  "ARG",       # unused arguments
  "C4",        # comprehensions
  "SIM",       # simplify
  "RET",       # return consistency
  "PL",        # pylint subset
  "RUF",       # ruff-specific
  "NPY",       # numpy idioms
  "PT",        # pytest style
  "T20",       # no print()
]
ignore = [
  "D105", "D107",    # magic methods / __init__ do not need docstrings
  "PLR0913",         # many-argument functions are common in model constructors
  "PLR2004",         # magic values: same reasoning as readability-magic-numbers in C++
  "E501",            # line length is the formatter's job
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "ANN", "PLR", "ARG"]
"**/test_*.py" = ["D", "ANN", "PLR", "ARG"]
"tools/**" = ["T20"]          # CLI tools may print
"tests/fixtures/gen_*.py" = ["T20"]   # fixture generators are CLI tools too
"**/launch/*.launch.py" = ["D", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["nuway_ml", "nuway_py", "nuway_eval", "nuway_rclpy", "nuway_carla_bridge", "nuway_perception", "nuway_prediction", "nuway_planning", "nuway_bringup", "nuway_viz"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# The ros2_ws Python packages are listed here so `uv run mypy` (pre-commit, CI)
# actually checks them; the override below relaxes strictness for them. A package
# is appended the moment it lands (M0 §3 tasks 6, 7, 11, 12; M1/M7 for the rest).
files = [
  "ml/nuway_ml", "tools", "tests",
  "ros2_ws/src/nuway_carla_bridge", "ros2_ws/src/nuway_rclpy", "ros2_ws/src/nuway_perception",
  "ros2_ws/src/nuway_bringup",
]
exclude = ["ros2_ws/(build|install|log)/", "ros2_ws/src/carla_msgs/", "ros2_ws/src/[a-z_]+/setup\\.py$", "data/", "external/"]
# The ros2_ws Python packages sit one directory deeper than their import name
# (ros2_ws/src/<pkg>/<pkg>/); mypy_path makes `import nuway_perception` resolve
# without an install step. tools/eval holds the nuway_eval package.
explicit_package_bases = true
mypy_path = [
  "ml", "tools/eval", "tools/viz", "tests/integration",
  "ros2_ws/src/nuway_carla_bridge", "ros2_ws/src/nuway_rclpy", "ros2_ws/src/nuway_perception",
  "ros2_ws/src/nuway_prediction", "ros2_ws/src/nuway_planning",
  "ros2_ws/src/nuway_bringup", "ros2_ws/src/nuway_viz",
]

[[tool.mypy.overrides]]
# Untyped, and present only when ROS / CARLA are installed: treated as Any
# (follow_imports = skip), so the same mypy run passes with and without them.
module = [
  "carla", "carla.*", "rclpy", "rclpy.*", "rosidl_runtime_py", "rosidl_runtime_py.*",
  "nuway_msgs.*", "carla_msgs.*", "nuway_py", "nuway_py.*",
  "std_msgs.*", "geometry_msgs.*", "sensor_msgs.*", "nav_msgs.*", "tf2_msgs.*",
  "visualization_msgs.*", "rosgraph_msgs.*", "builtin_interfaces.*", "tf2_ros", "tf2_ros.*",
  "launch", "launch.*", "launch_ros", "launch_ros.*", "ament_index_python", "ament_index_python.*",
  "leaderboard", "leaderboard.*", "srunner", "srunner.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Typed, but absent from the import-light environment (03 §6.1); matplotlib
# is the viz group (tools/sysid/fit_models.py plots), so a plain `uv sync`
# still type-checks.
module = ["torch.*", "webdataset", "webdataset.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ROS nodes and launch files: typed, but not strict (rclpy has no stubs).
module = ["nuway_carla_bridge.*", "nuway_perception.*", "nuway_prediction.*", "nuway_planning.*", "nuway_bringup.*", "nuway_viz.*"]
strict = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# The eval harness is rclpy code outside ros2_ws (01_directory_structure.md rules): same relaxation.
module = ["nuway_eval.*"]
strict = false
disallow_untyped_defs = true
