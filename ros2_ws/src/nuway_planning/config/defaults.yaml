# Package defaults for the nuway_planning nodes; the profile overrides them (docs/02 §5).
behavior_fsm_node:
  ros__parameters:
    overtake_enabled: false         # request a lane change to pass a slow lead (M1 §3.2 (b))
    slow_lead_margin_mps: 3.0       # lead slower than limit - margin ...
    slow_lead_s: 4.0                # ... for this long
    gap_back_m: 15.0                # target-lane gap [-back, +ahead] must be clear ...
    gap_ahead_m: 25.0
    gap_horizon_s: 3.0              # ... over the predictions up to this time
    change_commit_s: 3.0            # a change is kept at least this long
    abort_gap_m: 8.0                # ... unless a target-lane agent gets this close
    follow_range_m: 60.0            # lead search ahead
    lane_slack_m: 0.5               # lane band: half width + slack
    idm_s0_m: 2.0                   # IDM jam distance (M1 §3.2)
    idm_t_s: 1.5                    # IDM time headway
    idm_a_mps2: 1.5                 # IDM max acceleration
    idm_b_mps2: 2.5                 # IDM comfortable deceleration
    idm_horizon_s: 2.0              # target speed = v + a_idm * horizon
    a_comf_mps2: 2.5                # comfortable braking: stopping distance, dilemma zone
    t_react_s: 0.3                  # reaction time in the dilemma-zone rule
    stop_lookahead_m: 5.0           # stopping distance = v^2 / (2 a_comf) + this
    stop_margin_m: 1.0              # stop_s = stop line - this
    passed_line_m: 1.0              # a line this far behind is passed
    unknown_confidence: 0.5         # TL confidence below this: state unknown
    stop_sign_speed_mps: 0.2        # honoured: slower than this ...
    stop_sign_dist_m: 3.0           # ... within this of the line ...
    stop_sign_hold_s: 1.0           # ... for this long
    yield_horizon_s: 4.0            # crossings predicted up to this time
    yield_lookahead_m: 60.0         # ... this far ahead on the route
    yield_margin_m: 0.5             # corridor half width slack
    yield_time_margin_s: 1.5        # the agent must clear this long before us
    crossing_angle_rad: 0.5         # heading off the line by more: crossing traffic
    yield_stop_back_m: 3.0          # stop_s = s_conflict - this
    a_lat_max_mps2: 2.0             # curvature speed bound sqrt(a_lat_max / |kappa|)
    plan_decel_mps2: 2.0            # braking assumed on the approach to a bound
    curvature_horizon_m: 60.0       # floor of the speed-profile look-ahead
    projection_max_dist_m: 5.0      # farther off the line: no-input decision
    projection_back_m: 10.0         # Frenet projection window around the previous s
    projection_ahead_m: 50.0
    lane_search_dist_m: 3.0         # NearestLane radius for the ego lane
    default_lane_half_width_m: 1.75 # without a lane graph
    ego_front_m: 3.9                # rear axle to front bumper
